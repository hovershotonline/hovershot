name: Hover Shot - CI, Build e Deploy
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'services/multiplayer/**'
      - 'render.yaml'
      - '.github/workflows/render-multiplayer-ci.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'services/multiplayer/**'
      - 'render.yaml'
      - '.github/workflows/render-multiplayer-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hover-shot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Materializar jogo Guntanks original no commit aprovado
        run: git submodule update --init --depth 1 -- sources/originals/guntanks
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Testes do motor
        run: npm test
      - name: Validar catalogo de projetos originais
        run: npm run test:catalog
      - name: Validar sintaxe da interface e das avaliações
        run: |
          node --check site/assets/home.js
          node --check site/assets/playtest-model.js
      - name: Validar script de importação
        run: node --check scripts/package-guntanks.mjs
      - name: Validar configuracao e script de deploy (sem credenciais)
        run: |
          bash -n scripts/deploy-hostinger.sh
          node --test tests/deploy-config.test.mjs
      - name: Compilar hub e jogos locais
        run: npm run build
      - name: Testar formatos e URLs com versionamento dos assets
        run: node --test tests/build-assets.test.mjs
      - name: Verificar artefatos
        run: |
          test -s dist/index.html
          test -s dist/assets/home.css
          test -s dist/labs/craterfall/index.html
          test -d dist/labs/craterfall/assets
          test -s dist/labs/guntanks/index.html
          test -s dist/labs/guntanks/lib/bundle.js
          test -s dist/labs/guntanks/assets/terrain-full.png
          test -s dist/labs/guntanks/assets/tank-small-right.png
          grep -Fq 'Guntanks!' dist/labs/guntanks/index.html
          echo "RESULTADO=BUILD_VALIDADO"
      - uses: actions/upload-artifact@v4
        with:
          name: hover-shot-dist
          path: dist/
          retention-days: 7

  preparar-publicacao:
    name: Disponibilizar build estatico no GitHub
    needs: [build, hillshot-multiplayer-qa]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: hover-shot-dist
          path: ${{ runner.temp }}/hover-shot-publicacao
      - name: Validar artefato antes da promocao
        run: |
          test -s "${RUNNER_TEMP}/hover-shot-publicacao/index.html"
          test -s "${RUNNER_TEMP}/hover-shot-publicacao/labs/craterfall/index.html"
          test -s "${RUNNER_TEMP}/hover-shot-publicacao/labs/guntanks/index.html"
      - name: Publicar apenas os arquivos compilados na branch site-build
        shell: bash
        run: |
          set -Eeuo pipefail
          if git ls-remote --exit-code --heads origin site-build >/dev/null 2>&1; then
            git fetch origin site-build
            git checkout -B site-build FETCH_HEAD
          else
            git checkout --orphan site-build
          fi
          git rm -r --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "${RUNNER_TEMP}/hover-shot-publicacao/." .
          printf '%s\n' "${GITHUB_SHA}" > .hover-shot-source-commit
          git add -A
          if git diff --cached --quiet; then
            echo "RESULTADO=SITE_BUILD_SEM_ALTERACOES"
            exit 0
          fi
          git -c user.name="hover-shot-actions" -c user.email="actions@users.noreply.github.com" commit -m "build: site Hover Shot ${GITHUB_SHA}"
          git push origin HEAD:refs/heads/site-build
          echo "RESULTADO=BRANCH_SITE_BUILD_ATUALIZADA"

  hillshot-multiplayer-qa:
    name: Engine web - 2 jogadores e tiro (WS localhost)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Importar Hillshot no commit fixado
        run: |
          git submodule update --init --depth 1 -- sources/engines/hillshot
          test "$(git -C sources/engines/hillshot rev-parse HEAD)" = "4014612e9735b4e9c74dab94abcd941f2301630c"
          test -s sources/engines/hillshot/LICENSE
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar apenas dependencias para o runtime
        run: npm ci --omit=dev --no-audit --no-fund --prefix sources/engines/hillshot
      - name: Validar sintaxe e testar jogo em localhost
        run: |
          node --check sources/engines/hillshot/server/server.js
          node --check scripts/qa-hillshot.cjs
          node scripts/qa-hillshot.cjs

  deploy-hostinger:
    name: Publicar hovershot.online por SSH
    needs: preparar-publicacao
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - name: Checkout do script de deploy na main
        uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: true
      - name: Baixar build aprovado (mesmo artefato usado em site-build)
        uses: actions/download-artifact@v4
        with:
          name: hover-shot-dist
          path: ${{ runner.temp }}/hover-shot-release
      - name: Validar script e artefatos antes do deploy
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n source/scripts/deploy-hostinger.sh
          test -s "${RUNNER_TEMP}/hover-shot-release/index.html"
          test -s "${RUNNER_TEMP}/hover-shot-release/labs/craterfall/index.html"
          test -s "${RUNNER_TEMP}/hover-shot-release/labs/guntanks/index.html"
          echo "RESULTADO=DEPLOY_BUILD_VALIDADO"
      - name: Verificar segredo SSH de publicacao
        id: credential
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.HOVERSHOT_DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          if [[ -z "$PRIVATE_KEY" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::DEPLOY BLOQUEADO: cadastre o segredo HOVERSHOT_DEPLOY_SSH_PRIVATE_KEY em Settings > Secrets and variables > Actions."
            echo "DEPLOY=AGUARDANDO_CREDENCIAL_SSH (falha explícita; nenhuma alteração no host)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "CREDENCIAL_SSH=DISPONIVEL" >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar somente arquivos compilados na Hostinger
        if: steps.credential.outputs.ready == 'true'
        shell: bash
        env:
          HOVERSHOT_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.HOVERSHOT_DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          bash source/scripts/deploy-hostinger.sh \
            "$RUNNER_TEMP/hover-shot-release" \
            "$GITHUB_SHA" \
            "$GITHUB_WORKSPACE/source"
          echo "RESULTADO=GITHUB_ACTIONS_DEPLOY_VALIDADO" >> "$GITHUB_STEP_SUMMARY"
          echo "SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "SITE=https://hovershot.online/" >> "$GITHUB_STEP_SUMMARY"
